<!DOCTYPE html>

    <title>Unit Test - CariTandaBilangan</title>
</head>
<body>
    <script src="script.js"></script>
    <script>
        function testCariTandaBilangan() {
            console.assert(CariTandaBilangan(-5) === "Negatif", "Test 1 Gagal");

        testCariTandaBilangan();
