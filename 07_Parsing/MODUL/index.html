<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Mahasiswa</title>
</head>
<body>
    <script>
        fetch('path_to_your_json_file')
            .then(response => response.json())
            .then(data => {
                console.log(data);
                // Display data in HTML
                document.body.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            });
    </script>
</body>
</html>
